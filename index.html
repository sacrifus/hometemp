  <!-- CTO Signal styles -->

<script>
// =============================================================================
// Sensor definitions
// =============================================================================
var SENSORS = {
  outside:    { label: 'Outside',    hasHum: false },
  pool:       { label: 'Pool',       hasHum: false  },
  upstairs:   { label: 'Upstairs',   hasHum: true  },
  downstairs: { label: 'Downstairs', hasHum: true  },
  kitchen:    { label: 'Kitchen',    hasHum: true  },
  garage:     { label: 'Garage',     hasHum: true  }
};
var WIRELESSTAG_UUIDS = {
  outside:    '0f6ff5d2-dfa2-493e-893e-c9de8e50bfb0',
  upstairs:   'c579d742-9d4d-49e2-b979-720099ea52f2',
  downstairs: '066701db-0e8e-4eac-9507-0ff1659fcb01'
};
var YOLINK_DEVICES = {
  pool:    'Pool',
  kitchen: 'Kitchen',
  garage:  'Garage'
};
var WORKER_URL = 'https://fragrant-disk-2d6f.d-e29.workers.dev';
// Keep 10 days of 15-min readings = 10 * 24 * 4 = 960 points max per sensor
var MAX_POINTS = 960;
// =============================================================================
// localStorage helpers
// =============================================================================
function saveReading(sensorId, temp, hum) {
  try {
    var key = 'sensorHistory_' + sensorId;
    var history = JSON.parse(localStorage.getItem(key) || '[]');
    history.push({ t: Date.now(), temp: parseFloat(temp.toFixed(2)), hum: hum !== null && hum !== undefined ? parseFloat(hum.toFixed(2)) : null });
    if (history.length > MAX_POINTS) history = history.slice(-MAX_POINTS);
    localStorage.setItem(key, JSON.stringify(history));
  } catch(e) { /* quota exceeded or private browsing — silently skip */ }
}
// =============================================================================
// Display helpers
// =============================================================================
function showReading(sensorId, temp, hum, time) {
  var cfg = SENSORS[sensorId];
  if (!cfg) return;
  var el = document.getElementById('output-' + sensorId);
  if (!el) return;
  var timeStr = '';
  if (time) {
    var d = (time instanceof Date) ? time : new Date(time);
    timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  // Pool displays in °F; all other sensors display in °C.
  var displayTemp, unit;
  if (sensorId === 'pool') {
    displayTemp = temp * 9 / 5 + 32;
    unit = '&deg;F';
  } else {
    displayTemp = temp;
    unit = '&deg;C';
  }
  var html = '<b>' + cfg.label + ': </b>'
    + '<span class="temp full">'
    + displayTemp.toFixed(1)
    + '<span class="sup">' + unit + '</span>&nbsp;&nbsp;&nbsp;</span>';
  if (hum !== null && hum !== undefined && cfg.hasHum) {
    html += 'Humidity: <b>' + hum.toFixed(1) + '%</b>';
  } else if (timeStr) {
    html += 'Updated: <b>' + timeStr + '</b>';
  }
  el.innerHTML = html;
}
function showError(sensorId, message) {
  var el = document.getElementById('output-' + sensorId);
  if (el) el.innerHTML = '<b>' + SENSORS[sensorId].label + ':</b> ' + message;
}
// =============================================================================
// WirelessTag fetching
// =============================================================================
$.ajaxSetup({
  type: 'POST',
  contentType: 'application/json; charset=utf-8',
  cache: false,
  dataType: 'json',
  xhrFields: { withCredentials: false }
});
function fetchWirelessTag(sensorId) {
  $.ajax({
    url: 'https://www.wirelesstag.net/ethLogShared.asmx/GetLatestTemperatureRawDataByUUID',
    data: JSON.stringify({ uuid: WIRELESSTAG_UUIDS[sensorId] }),
    success: function(retval) {
      var d = retval.d;
      var temp = d.temp_degC;
      var hum  = (d.cap !== undefined && SENSORS[sensorId].hasHum) ? d.cap : null;
      var time = new Date();  // use now as the timestamp for the stored reading
      showReading(sensorId, temp, hum, time);
      saveReading(sensorId, temp, hum);
    },
    error: function() {
      showError(sensorId, 'Read error');
    }
  });
}
fetchWirelessTag('outside');
fetchWirelessTag('upstairs');
fetchWirelessTag('downstairs');
// =============================================================================
// YoLink fetching
// =============================================================================
function yolinkApi(accessToken, body, cb) {
  $.ajax({
    url: WORKER_URL + '?action=api&token=' + encodeURIComponent(accessToken),
    type: 'POST',
    contentType: 'application/json; charset=utf-8',
    dataType: 'json',
    data: JSON.stringify(body),
    success: cb,
    error: function() { cb(null); }
  });
}
$.ajax({
  url: WORKER_URL + '?action=token',
  type: 'POST',
  contentType: 'application/x-www-form-urlencoded',
  dataType: 'json',
  success: function(tokenData) {
    var accessToken = tokenData.access_token;
    yolinkApi(accessToken, { method: 'Home.getDeviceList' }, function(retval) {
      if (!retval) {
        $.each(YOLINK_DEVICES, function(sensorId) {
          showError(sensorId, 'Device list error');
        });
        return;
      }
      var devices = retval.data.devices;
      $.each(YOLINK_DEVICES, function(sensorId, deviceName) {
        var match = null;
        $.each(devices, function(i, dev) {
          if (dev.name === deviceName) { match = dev; return false; }
        });
        if (!match) {
          showError(sensorId, 'Sensor not found');
          return;
        }
        yolinkApi(accessToken, {
          method: 'THSensor.getState',
          targetDevice: match.deviceId,
          token: match.token
        }, function(stateRetval) {
          if (!stateRetval) {
            showError(sensorId, 'Read error');
            return;
          }
          var state = stateRetval.data.state;
          var temp  = state.temperature;
          var hum   = (state.humidity !== undefined && SENSORS[sensorId].hasHum)
                        ? state.humidity : null;
          showReading(sensorId, temp, hum, new Date());
          saveReading(sensorId, temp, hum);
        });
      });
    });
  },
  error: function() {
    $.each(YOLINK_DEVICES, function(sensorId) {
      showError(sensorId, 'Authentication error');
    });
  }
});

// =============================================================================
// CTO Line Signals – BTCUSD + ETHUSD 1D
// =============================================================================
function smma(src, length) {
  var result = new Array(src.length).fill(NaN);
  var sum = 0;
  for (var i = 0; i < src.length; i++) {
    if (i < length - 1) {
      sum += src[i];
      continue;
    }
    if (i === length - 1) {
      sum += src[i];
      result[i] = sum / length;
    } else {
      result[i] = (result[i - 1] * (length - 1) + src[i]) / length;
    }
  }
  return result;
}

// Signal at bar i given the four SMMA series [v1, m1, m2, v2]
function ctoSignalAt(a, i) {
  var v1 = a[0][i], m1 = a[1][i], m2 = a[2][i], v2 = a[3][i];
  if (isNaN(v2)) return null;
  var p2 = (v1 < m1) !== (v1 < v2) || (m2 < v2) !== (v1 < v2);
  if (p2) return 'neutral';
  return (v1 < v2) ? 'sell' : 'buy';
}

var CTO_TEXT  = { buy: 'BUY', neutral: 'NEUTRAL', sell: 'SELL' };
var CTO_COLOR = { buy: 'Orange', neutral: 'Silver / Gray', sell: 'Navy / Blue' };

// Remember each card's original order so cards moved to the top stay in the same order
document.querySelectorAll('.cto-signal-card').forEach(function(card, i) {
  card.setAttribute('data-order', i);
});

// Move a single card to the top row when its signal is NEUTRAL; others stay at the bottom
function placeCtoCard(key, signal) {
  if (signal !== 'neutral') return;

  var card    = document.getElementById('cto-signal-' + key).closest('.cto-signal-card');
  var top     = document.getElementById('cto-top');
  var fromRow = card.parentNode;
  var order   = +card.getAttribute('data-order');

  var before = null;
  for (var i = 0; i < top.children.length; i++) {
    if (+top.children[i].getAttribute('data-order') > order) { before = top.children[i]; break; }
  }
  top.insertBefore(card, before);
  top.style.display = '';

  // Hide a bottom row once all of its cards have moved up
  if (!fromRow.querySelector('.cto-signal-card')) fromRow.style.display = 'none';
}

function getJson(url) {
  return fetch(url).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}

// Each loader resolves to candles, oldest first: [openTimeMs, open, high, low, close]

// Binance: 1000 daily bars so the slow SMMAs are fully warmed up (matches TradingView)
function loadBinance(symbol) {
  return getJson('https://data-api.binance.vision/api/v3/klines?symbol=' + symbol + '&interval=1d&limit=1000')
    .then(function(data) {
      return data.map(function(c) {
        return [c[0], parseFloat(c[1]), parseFloat(c[2]), parseFloat(c[3]), parseFloat(c[4])];
      });
    });
}

// GeckoTerminal DEX pool (PulseChain etc.). timeframe 'day' / 'hour' / 'minute', aggregate e.g. 4
// for 4h candles (UTC-aligned). Returns newest first; token=quote prices the pool's quote token.
// Daily only gets ~6 months per call, so fetch a second page when the first is short.
function loadGeckoPool(network, pool, token, timeframe, aggregate) {
  var base = 'https://api.geckoterminal.com/api/v2/networks/' + network + '/pools/' + pool
           + '/ohlcv/' + timeframe + '?aggregate=' + aggregate
           + '&currency=usd&limit=1000&token=' + token;
  return getJson(base).then(function(p1) {
    var list = p1.data.attributes.ohlcv_list;
    if (!list.length || list.length >= 300) return list;
    return getJson(base + '&before_timestamp=' + list[list.length - 1][0])
      .then(function(p2) { return list.concat(p2.data.attributes.ohlcv_list); },
            function()   { return list; });  // one page is still enough
  }).then(function(list) {
    return list.reverse().map(function(c) { return [c[0] * 1000, c[1], c[2], c[3], c[4]]; });
  });
}

function fmtUsd(v) {
  if (v >= 100) return v.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  // Small prices (e.g. PLS): keep 4 significant digits
  return '$' + v.toPrecision(4).replace(/\.?0+$/, '');
}

// intraday = true for sub-daily timeframes (shows times, durations in hours)
function fetchCtoSignal(loader, key, intraday) {
  var signalEl = document.getElementById('cto-signal-' + key);
  var metaEl   = document.getElementById('cto-meta-' + key);

  loader()
    .then(function(data) {
      if (data.length < 31) throw new Error('Not enough history');

      var hl2 = data.map(function(c) { return (c[2] + c[3]) / 2; });
      var a = [smma(hl2, 15), smma(hl2, 19), smma(hl2, 25), smma(hl2, 29)];

      var last   = hl2.length - 1;           // live (still-forming) candle
      var live   = ctoSignalAt(a, last);
      var closed = ctoSignalAt(a, last - 1); // last completed candle

      // Walk back to find when the closed-candle signal started
      var start = last - 1;
      while (start > 0 && ctoSignalAt(a, start - 1) === closed) start--;
      var hours = Math.round((Date.now() - data[start][0]) / 3600000);
      var age = hours < 48 ? hours + ' hours' : Math.round(hours / 24) + ' days';

      // Daily candles open at 00:00 UTC, so show them as UTC dates;
      // intraday candles are shown in local time
      var utcDate = function(ms) {
        if (intraday) {
          return new Date(ms).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
        }
        return new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      };

      signalEl.textContent = CTO_TEXT[closed];
      signalEl.className   = 'cto-signal ' + closed;

      metaEl.innerHTML =
        '<strong>Color:</strong> ' + CTO_COLOR[closed] + '<br>' +
        '<strong>Since:</strong> ' + utcDate(data[start][0]) + ' (' + age + ')<br>' +
        '<strong>Live candle:</strong> ' + CTO_TEXT[live] +
          (live !== closed ? ' <span class="cto-warn">⚠ may flip at close</span>' : '') + '<br>' +
        '<strong>Last close:</strong> ' + fmtUsd(data[last - 1][4]) + ' (' + utcDate(data[last - 1][0]) + ')<br>' +
        'Updated: ' + new Date().toLocaleTimeString();

      // Move this card to the top if it's NEUTRAL
      placeCtoCard(key, closed);
    })
    .catch(function(err) {
      // Errors are not NEUTRAL, so the card stays at the bottom
      signalEl.textContent = 'Error';
      signalEl.className = 'cto-signal error';
      metaEl.textContent = err.message + ' – will retry on next page refresh';
    });
}

// Run all on load
fetchCtoSignal(function() { return loadBinance('BTCUSDT'); }, 'btc');
fetchCtoSignal(function() { return loadBinance('ETHUSDT'); }, 'eth');
// PulseX WPLS/DAI pool – TradingView WPLSDAI_E56043.USD, 4h candles
fetchCtoSignal(function() {
  return loadGeckoPool('pulsechain', '0xE56043671df55dE5CDf8459710433C10324DE0aE', 'quote', 'hour', 4);
}, 'pls', true);
// PulseX HEX/WPLS pool – TradingView HEXWPLS_F1F4EE.USD, 4h candles (HEX is the base token)
fetchCtoSignal(function() {
  return loadGeckoPool('pulsechain', '0xf1f4ee610b2babb05c635f726ef8b0c568c8dc65', 'base', 'hour', 4);
}, 'hex', true);
// PulseX USDC/PRVX pool – TradingView PRVXUSDC_7F681A.USD, 4h candles
fetchCtoSignal(function() {
  return loadGeckoPool('pulsechain', '0x7f681a5ad615238357ba148c281e2eaefd2de55a', 'quote', 'hour', 4);
}, 'prvx', true);
// PulseX DAI/WPLS pool AE8429 – most liquid pDAI pool, 4h candles (pDAI is the base token)
fetchCtoSignal(function() {
  return loadGeckoPool('pulsechain', '0xae8429918fdbf9a5867e3243697637dc56aa76a1', 'base', 'hour', 4);
}, 'pdai', true);
</script>
