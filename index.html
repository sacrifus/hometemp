<script>
// =============================================================================
// Sensor definitions
// =============================================================================
var SENSORS = {
  outside:    { label: 'Extérieur', hasHum: false },
  pool:       { label: 'Piscine',   hasHum: false  },
  upstairs:   { label: 'En haut',   hasHum: true  },
  downstairs: { label: 'En bas',    hasHum: true  },
  kitchen:    { label: 'Cuisine',   hasHum: true  },
  garage:     { label: 'Garage',    hasHum: true  }
};
var WIRELESSTAG_UUIDS = {
  outside:    '0f6ff5d2-dfa2-493e-893e-c9de8e50bfb0',
  upstairs:   'c579d742-9d4d-49e2-b979-720099ea52f2',
  downstairs: '066701db-0e8e-4eac-9507-0ff1659fcb01'
};
var YOLINK_DEVICES = {
  pool:    'Pool',
  kitchen: 'Kitchen',
  garage:  'Garage'
};
var WORKER_URL = 'https://fragrant-disk-2d6f.d-e29.workers.dev';
// Keep 10 days of 15-min readings = 10 * 24 * 4 = 960 points max per sensor
var MAX_POINTS = 960;
// =============================================================================
// localStorage helpers
// =============================================================================
function saveReading(sensorId, temp, hum) {
  try {
    var key = 'sensorHistory_' + sensorId;
    var history = JSON.parse(localStorage.getItem(key) || '[]');
    history.push({ t: Date.now(), temp: parseFloat(temp.toFixed(2)), hum: hum !== null && hum !== undefined ? parseFloat(hum.toFixed(2)) : null });
    if (history.length > MAX_POINTS) history = history.slice(-MAX_POINTS);
    localStorage.setItem(key, JSON.stringify(history));
  } catch(e) { /* quota exceeded or private browsing — silently skip */ }
}
// =============================================================================
// Display helpers
// =============================================================================
function showReading(sensorId, temp, hum, time) {
  var cfg = SENSORS[sensorId];
  if (!cfg) return;
  var el = document.getElementById('output-' + sensorId);
  if (!el) return;
  var timeStr = '';
  if (time) {
    var d = (time instanceof Date) ? time : new Date(time);
    timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  // Pool displays in °F; all other sensors display in °C.
  var displayTemp, unit;
  if (sensorId === 'pool') {
    displayTemp = temp * 9 / 5 + 32;
    unit = '&deg;F';
  } else {
    displayTemp = temp;
    unit = '&deg;C';
  }
  var html = '<b>' + cfg.label + ': </b>'
    + '<span class="temp full">'
    + displayTemp.toFixed(1)
    + '<span class="sup">' + unit + '</span>&nbsp;&nbsp;&nbsp;</span>';
  if (hum !== null && hum !== undefined && cfg.hasHum) {
    html += 'Humidité: <b>' + hum.toFixed(1) + '%</b>';
  } else if (timeStr) {
    html += 'Mise à jour: <b>' + timeStr + '</b>';
  }
  el.innerHTML = html;
}
// =============================================================================
// WirelessTag fetching
// =============================================================================
$.ajaxSetup({
  type: 'POST',
  contentType: 'application/json; charset=utf-8',
  cache: false,
  dataType: 'json',
  xhrFields: { withCredentials: false }
});
function fetchWirelessTag(sensorId) {
  $.ajax({
    url: 'https://my.wirelesstag.net/ethLogShared.asmx/GetLatestTemperatureRawDataByUUID',
    data: JSON.stringify({ uuid: WIRELESSTAG_UUIDS[sensorId] }),
    success: function(retval) {
      var d = retval.d;
      var temp = d.temp_degC;
      var hum  = (d.cap !== undefined && SENSORS[sensorId].hasHum) ? d.cap : null;
      var time = new Date();  // use now as the timestamp for the stored reading
      showReading(sensorId, temp, hum, time);
      saveReading(sensorId, temp, hum);
    },
    error: function() {
      var el = document.getElementById('output-' + sensorId);
      if (el) el.innerHTML = '<b>' + SENSORS[sensorId].label + ':</b> Erreur de lecture';
    }
  });
}
fetchWirelessTag('outside');
fetchWirelessTag('upstairs');
fetchWirelessTag('downstairs');
// =============================================================================
// YoLink fetching
// =============================================================================
function yolinkApi(accessToken, body, cb) {
  $.ajax({
    url: WORKER_URL + '?action=api&token=' + encodeURIComponent(accessToken),
    type: 'POST',
    contentType: 'application/json; charset=utf-8',
    dataType: 'json',
    data: JSON.stringify(body),
    success: cb,
    error: function() { cb(null); }
  });
}
$.ajax({
  url: WORKER_URL + '?action=token',
  type: 'POST',
  contentType: 'application/x-www-form-urlencoded',
  dataType: 'json',
  success: function(tokenData) {
    var accessToken = tokenData.access_token;
    yolinkApi(accessToken, { method: 'Home.getDeviceList' }, function(retval) {
      if (!retval) {
        $.each(YOLINK_DEVICES, function(sensorId) {
          var el = document.getElementById('output-' + sensorId);
          if (el) el.innerHTML = '<b>' + SENSORS[sensorId].label + ':</b> Erreur liste appareils';
        });
        return;
      }
      var devices = retval.data.devices;
      $.each(YOLINK_DEVICES, function(sensorId, deviceName) {
        var match = null;
        $.each(devices, function(i, dev) {
          if (dev.name === deviceName) { match = dev; return false; }
        });
        if (!match) {
          var el = document.getElementById('output-' + sensorId);
          if (el) el.innerHTML = '<b>' + SENSORS[sensorId].label + ':</b> Capteur introuvable';
          return;
        }
        yolinkApi(accessToken, {
          method: 'THSensor.getState',
          targetDevice: match.deviceId,
          token: match.token
        }, function(stateRetval) {
          if (!stateRetval) {
            var el = document.getElementById('output-' + sensorId);
            if (el) el.innerHTML = '<b>' + SENSORS[sensorId].label + ':</b> Erreur de lecture';
            return;
          }
          var state = stateRetval.data.state;
          var temp  = state.temperature;
          var hum   = (state.humidity !== undefined && SENSORS[sensorId].hasHum)
                        ? state.humidity : null;
          showReading(sensorId, temp, hum, new Date());
          saveReading(sensorId, temp, hum);
        });
      });
    });
  },
  error: function() {
    $.each(YOLINK_DEVICES, function(sensorId) {
      var el = document.getElementById('output-' + sensorId);
      if (el) el.innerHTML = '<b>' + SENSORS[sensorId].label + ':</b> Erreur d\'authentification';
    });
  }
});

// =============================================================================
// CTO Line Signals – BTCUSD + ETHUSD 1D
// =============================================================================
function smma(src, length) {
  var result = new Array(src.length).fill(NaN);
  var sum = 0;
  for (var i = 0; i < src.length; i++) {
    if (i < length - 1) {
      sum += src[i];
      continue;
    }
    if (i === length - 1) {
      sum += src[i];
      result[i] = sum / length;
    } else {
      result[i] = (result[i - 1] * (length - 1) + src[i]) / length;
    }
  }
  return result;
}

var ctoResults = { btc: null, eth: null };

function updateCtoPosition() {
  // Wait until both results are in
  if (ctoResults.btc === null || ctoResults.eth === null) return;

  var section = document.getElementById('cto-signal-section');
  var topPlaceholder = document.getElementById('cto-top-placeholder');
  var container = document.getElementById('main-container');

  var isNeutral = (ctoResults.btc === 'neutral' || ctoResults.eth === 'neutral');

  if (isNeutral) {
    // Move to top
    topPlaceholder.appendChild(section);
  } else {
    // Move to bottom (after the sensor rows)
    container.appendChild(section);
  }
}

function fetchCtoSignal(symbol, signalId, metaId, key) {
  var signalEl = document.getElementById(signalId);
  var metaEl   = document.getElementById(metaId);

  fetch('https://api.binance.com/api/v3/klines?symbol=' + symbol + '&interval=1d&limit=100')
    .then(function(res) {
      if (!res.ok) throw new Error('Network error');
      return res.json();
    })
    .then(function(data) {
      var hl2 = data.map(function(c) {
        return (parseFloat(c[2]) + parseFloat(c[3])) / 2;
      });

      var v1 = smma(hl2, 15);
      var m1 = smma(hl2, 19);
      var m2 = smma(hl2, 25);
      var v2 = smma(hl2, 29);

      var i = hl2.length - 1;

      var p2 = (v1[i] < m1[i]) !== (v1[i] < v2[i]) || (m2[i] < v2[i]) !== (v1[i] < v2[i]);
      var p3 = !p2 && (v1[i] < v2[i]);
      var p1 = !p2 && !p3;

      var text, cls, colorName;
      if (p1) {
        text = 'BUY';
        cls  = 'buy';
        colorName = 'Orange';
      } else if (p2) {
        text = 'NEUTRAL';
        cls  = 'neutral';
        colorName = 'Silver / Gray';
      } else {
        text = 'SELL';
        cls  = 'sell';
        colorName = 'Navy / Blue';
      }

      signalEl.textContent = text;
      signalEl.className = cls;

      var lastClose = parseFloat(data[i][4]).toLocaleString('en-US', {
        style: 'currency', currency: 'USD', maximumFractionDigits: 0
      });
      var time = new Date(data[i][0]).toLocaleDateString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric'
      });

      metaEl.innerHTML =
        '<strong>Color:</strong> ' + colorName + '<br>' +
        '<strong>Last daily close:</strong> ' + lastClose + '<br>' +
        '<strong>Bar date:</strong> ' + time + '<br>' +
        'Updated: ' + new Date().toLocaleTimeString();

      // Store result and possibly move the section
      ctoResults[key] = cls;
      updateCtoPosition();
    })
    .catch(function(err) {
      signalEl.textContent = 'Error';
      signalEl.className = 'error';
      metaEl.textContent = err.message + ' – will retry on next page refresh';

      // Treat error as non-neutral so section stays at bottom
      ctoResults[key] = 'error';
      updateCtoPosition();
    });
}

// Run both on load
fetchCtoSignal('BTCUSDT', 'cto-signal-btc', 'cto-meta-btc', 'btc');
fetchCtoSignal('ETHUSDT', 'cto-signal-eth', 'cto-meta-eth', 'eth');
</script>
