<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CTO Chart</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1115;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
    }

    /* ---- Header ---- */
    header {
      background: #1a1d24;
      border-bottom: 1px solid #2a2e37;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    header a.btn {
      text-decoration: none;
      color: #bbb;
      font-size: 13px;
      background: #262a33;
      border: 1px solid #3a3f4a;
      padding: 5px 12px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    header a.btn:hover { background: #323743; }
    header h1 { font-size: 18px; font-weight: 600; color: #ddd; }

    .signal-badge {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      padding: 3px 10px;
      border-radius: 4px;
      background: #262a33;
    }
    .signal-badge.buy     { color: #00c853; }
    .signal-badge.sell    { color: #ff1744; }
    .signal-badge.neutral { color: #9e9e9e; }

    .price { font-size: 16px; font-weight: 600; color: #ccc; }
    .price .up   { color: #00c853; }
    .price .down { color: #ff1744; }

    header .ext { margin-left: auto; }

    /* ---- Range bar ---- */
    .range-bar {
      background: #1a1d24;
      border-bottom: 1px solid #2a2e37;
      padding: 8px 20px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .range-bar span { font-size: 12px; color: #888; margin-right: 4px; }
    .range-btn {
      font-size: 12px;
      padding: 4px 12px;
      border: 1px solid #3a3f4a;
      background: #262a33;
      border-radius: 3px;
      cursor: pointer;
      color: #bbb;
      transition: background 0.15s;
    }
    .range-btn:hover  { background: #323743; }
    .range-btn.active { background: #555; color: #fff; border-color: #666; }

    .legend { margin-left: auto; font-size: 12px; color: #888; }
    .legend i {
      display: inline-block; width: 10px; height: 10px; border-radius: 2px;
      margin: 0 4px 0 10px; vertical-align: -1px;
    }

    /* ---- Chart ---- */
    #chart { flex: 1; min-height: 360px; position: relative; }
    .status {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #666; font-size: 15px;
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="btn">← Back</a>
  <h1 id="page-title">CTO Chart</h1>
  <span id="signal-badge" class="signal-badge"></span>
  <span id="price" class="price"></span>
  <a id="ext-link" class="btn ext" target="_blank" rel="noopener" style="display:none"></a>
</header>

<div class="range-bar">
  <span>Range:</span>
  <button class="range-btn" data-bars="60">60 bars</button>
  <button class="range-btn active" data-bars="180">180 bars</button>
  <button class="range-btn" data-bars="365">365 bars</button>
  <button class="range-btn" data-bars="0">All</button>
  <div class="legend">
    CTO:<i style="background:#FF9800"></i>Buy<i style="background:#B2B5BE"></i>Neutral<i style="background:#311B92"></i>Sell
  </div>
</div>

<div id="chart"><div class="status" id="status">Loading…</div></div>

<script>
// =============================================================================
// Coin definitions (mirrors the CTO cards in index.html)
// =============================================================================
var COINS = {
  btc:  { label: 'BTCUSD · 1D',    source: 'binance', symbol: 'BTCUSDT',
          ext: { name: 'TradingView', url: 'https://www.tradingview.com/chart/?symbol=BINANCE:BTCUSDT&interval=1D' } },
  eth:  { label: 'ETHUSD · 1D',    source: 'binance', symbol: 'ETHUSDT',
          ext: { name: 'TradingView', url: 'https://www.tradingview.com/chart/?symbol=BINANCE:ETHUSDT&interval=1D' } },
  pls:  { label: 'WPLS/DAI · 4H',  source: 'gecko', pool: '0xE56043671df55dE5CDf8459710433C10324DE0aE', token: 'quote' },
  hex:  { label: 'HEX/WPLS · 4H',  source: 'gecko', pool: '0xf1f4ee610b2babb05c635f726ef8b0c568c8dc65', token: 'base'  },
  prvx: { label: 'PRVX/USDC · 4H', source: 'gecko', pool: '0x7f681a5ad615238357ba148c281e2eaefd2de55a', token: 'quote' },
  pdai: { label: 'PDAI/WPLS · 4H', source: 'gecko', pool: '0xae8429918fdbf9a5867e3243697637dc56aa76a1', token: 'base'  }
};

// Pine Script colors used by the CTO Line indicator: color.orange / color.silver / color.navy
var SIGNAL_COLOR = { buy: '#FF9800', neutral: '#B2B5BE', sell: '#311B92' };
var SIGNAL_TEXT  = { buy: 'BUY', neutral: 'NEUTRAL', sell: 'SELL' };

var coinId = new URLSearchParams(window.location.search).get('coin') || '';
var coin   = COINS[coinId];

// =============================================================================
// Data loaders – same sources as index.html; candles oldest first:
// [openTimeMs, open, high, low, close]
// =============================================================================
function getJson(url) {
  return fetch(url).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}

function loadBinance(symbol) {
  return getJson('https://data-api.binance.vision/api/v3/klines?symbol=' + symbol + '&interval=1d&limit=1000')
    .then(function(data) {
      return data.map(function(c) {
        return [c[0], parseFloat(c[1]), parseFloat(c[2]), parseFloat(c[3]), parseFloat(c[4])];
      });
    });
}

function loadGeckoPool(network, pool, token, timeframe, aggregate) {
  var base = 'https://api.geckoterminal.com/api/v2/networks/' + network + '/pools/' + pool
           + '/ohlcv/' + timeframe + '?aggregate=' + aggregate
           + '&currency=usd&limit=1000&token=' + token;
  return getJson(base).then(function(p1) {
    var list = p1.data.attributes.ohlcv_list;
    if (!list.length || list.length >= 300) return list;
    return getJson(base + '&before_timestamp=' + list[list.length - 1][0])
      .then(function(p2) { return list.concat(p2.data.attributes.ohlcv_list); },
            function()   { return list; });
  }).then(function(list) {
    return list.reverse().map(function(c) { return [c[0] * 1000, c[1], c[2], c[3], c[4]]; });
  });
}

function loadCoin(c) {
  if (c.source === 'binance') return loadBinance(c.symbol);
  return loadGeckoPool('pulsechain', c.pool, c.token, 'hour', 4);
}

// =============================================================================
// CTO Line math (same as index.html)
// =============================================================================
function smma(src, length) {
  var result = new Array(src.length).fill(NaN);
  var sum = 0;
  for (var i = 0; i < src.length; i++) {
    if (i < length - 1) {
      sum += src[i];
      continue;
    }
    if (i === length - 1) {
      sum += src[i];
      result[i] = sum / length;
    } else {
      result[i] = (result[i - 1] * (length - 1) + src[i]) / length;
    }
  }
  return result;
}

function ctoSignalAt(a, i) {
  var v1 = a[0][i], m1 = a[1][i], m2 = a[2][i], v2 = a[3][i];
  if (isNaN(v2)) return null;
  var p2 = (v1 < m1) !== (v1 < v2) || (m2 < v2) !== (v1 < v2);
  if (p2) return 'neutral';
  return (v1 < v2) ? 'sell' : 'buy';
}

function fmtUsd(v) {
  if (v >= 100) return v.toLocaleString('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  return '$' + v.toPrecision(4).replace(/\.?0+$/, '');
}

// Enough decimals to show ~4 significant digits for tiny prices
function priceFormatFor(price) {
  var precision = price >= 1 ? 2 : Math.min(12, Math.ceil(-Math.log10(price)) + 3);
  return { type: 'price', precision: precision, minMove: Math.pow(10, -precision) };
}

// =============================================================================
// Band custom series – fills between the fast and slow CTO lines, each segment
// tinted with that bar's signal color (lightweight-charts has no built-in fill)
// =============================================================================
function hexToRgba(hex, alpha) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
}

function BandRenderer() { this._data = null; }
BandRenderer.prototype.update = function(data) { this._data = data; };
BandRenderer.prototype.draw = function(target, priceToCoordinate) {
  var data = this._data;
  if (!data || !data.visibleRange) return;
  target.useBitmapCoordinateSpace(function(scope) {
    var ctx = scope.context, hr = scope.horizontalPixelRatio, vr = scope.verticalPixelRatio;
    var bars = data.bars;
    var from = Math.max(1, data.visibleRange.from), to = Math.min(bars.length, data.visibleRange.to + 1);
    for (var i = from; i < to; i++) {
      var a = bars[i - 1], b = bars[i];
      if (a.originalData.upper === undefined || b.originalData.upper === undefined) continue;
      ctx.beginPath();
      ctx.moveTo(a.x * hr, priceToCoordinate(a.originalData.upper) * vr);
      ctx.lineTo(b.x * hr, priceToCoordinate(b.originalData.upper) * vr);
      ctx.lineTo(b.x * hr, priceToCoordinate(b.originalData.lower) * vr);
      ctx.lineTo(a.x * hr, priceToCoordinate(a.originalData.lower) * vr);
      ctx.closePath();
      ctx.fillStyle = b.originalData.fill;
      ctx.fill();
    }
  });
};

function BandSeries() { this._renderer = new BandRenderer(); }
BandSeries.prototype.priceValueBuilder = function(d) { return [d.upper, d.lower]; };
BandSeries.prototype.isWhitespace = function(d) { return d.upper === undefined; };
BandSeries.prototype.renderer = function() { return this._renderer; };
BandSeries.prototype.update = function(data) { this._renderer.update(data); };
BandSeries.prototype.defaultOptions = function() {
  return Object.assign({}, LightweightCharts.customSeriesDefaultOptions);
};

// =============================================================================
// Chart
// =============================================================================
var statusEl = document.getElementById('status');
var chart = null;
var barCount = 0;

function setRange(bars) {
  if (!chart || !barCount) return;
  if (!bars || bars >= barCount) {
    chart.timeScale().fitContent();
  } else {
    chart.timeScale().setVisibleLogicalRange({ from: barCount - bars, to: barCount + 2 });
  }
}

function render(data) {
  if (data.length < 31) throw new Error('Not enough history');

  var hl2 = data.map(function(c) { return (c[2] + c[3]) / 2; });
  var a = [smma(hl2, 15), smma(hl2, 19), smma(hl2, 25), smma(hl2, 29)];
  var last = data.length - 1;

  // ---- Header: closed-candle signal + price/daily change (same rules as the card) ----
  var closed = ctoSignalAt(a, last - 1);
  var badge  = document.getElementById('signal-badge');
  badge.textContent = SIGNAL_TEXT[closed];
  badge.className   = 'signal-badge ' + closed;

  var price    = data[last][4];
  var dayStart = Math.floor(Date.now() / 86400000) * 86400000;
  var ref = null;
  for (var j = last; j >= 0; j--) {
    if (data[j][0] < dayStart) { ref = data[j][4]; break; }
  }
  var priceHtml = fmtUsd(price);
  if (ref) {
    var pct = (price / ref - 1) * 100;
    priceHtml += ' <span class="' + (pct >= 0 ? 'up' : 'down') + '">'
               + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%</span>';
  }
  document.getElementById('price').innerHTML = priceHtml;

  // ---- Series data (lightweight-charts wants UTC seconds) ----
  var candles = [], fast = [], slow = [], band = [], strip = [];
  data.forEach(function(c, i) {
    var t = Math.floor(c[0] / 1000);
    candles.push({ time: t, open: c[1], high: c[2], low: c[3], close: c[4] });
    var sig = ctoSignalAt(a, i);
    if (!sig) {
      fast.push({ time: t });
      slow.push({ time: t });
      band.push({ time: t });
      strip.push({ time: t });
      return;
    }
    var col = SIGNAL_COLOR[sig];
    fast.push({ time: t, value: a[0][i], color: col });
    slow.push({ time: t, value: a[3][i], color: col });
    band.push({ time: t, upper: a[0][i], lower: a[3][i], fill: hexToRgba(col, 0.3) });
    strip.push({ time: t, value: 1, color: col });
  });

  statusEl.style.display = 'none';
  var el = document.getElementById('chart');
  chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: '#0f1115' }, textColor: '#888' },
    grid: {
      vertLines: { color: 'rgba(255,255,255,0.04)' },
      horzLines: { color: 'rgba(255,255,255,0.04)' }
    },
    rightPriceScale: { borderColor: '#2a2e37', scaleMargins: { top: 0.08, bottom: 0.1 } },
    timeScale: { borderColor: '#2a2e37', timeVisible: coin.source !== 'binance', rightOffset: 2 },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
  });

  var fmt = priceFormatFor(price);

  // Fill between the CTO lines, drawn first so the candles sit on top
  chart.addCustomSeries(new BandSeries(), { priceFormat: fmt, lastValueVisible: false, priceLineVisible: false,
                                            crosshairMarkerVisible: false }).setData(band);

  chart.addCandlestickSeries({
    upColor: '#4caf50', downColor: '#ef5350',
    borderVisible: false,
    wickUpColor: '#4caf50', wickDownColor: '#ef5350',
    priceFormat: fmt
  }).setData(candles);

  // CTO lines: fast (15) and slow (29) SMMA of hl2, colored by the signal on each bar
  chart.addLineSeries({ lineWidth: 2, priceFormat: fmt, lastValueVisible: false, priceLineVisible: false,
                        crosshairMarkerVisible: false }).setData(fast);
  chart.addLineSeries({ lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dotted, priceFormat: fmt,
                        lastValueVisible: false, priceLineVisible: false,
                        crosshairMarkerVisible: false }).setData(slow);

  // Signal strip along the bottom of the chart
  chart.addHistogramSeries({ priceScaleId: 'signal', lastValueVisible: false, priceLineVisible: false })
    .setData(strip);
  chart.priceScale('signal').applyOptions({ scaleMargins: { top: 0.95, bottom: 0 }, visible: false });

  barCount = data.length;
  setRange(+document.querySelector('.range-btn.active').dataset.bars);
}

// =============================================================================
// Init
// =============================================================================
if (!coin) {
  document.getElementById('page-title').textContent = 'Unknown coin';
  statusEl.textContent = 'Unknown coin "' + coinId + '"';
} else {
  document.getElementById('page-title').textContent = coin.label;
  document.title = 'CTO — ' + coin.label;

  var ext = coin.ext || {
    name: 'GeckoTerminal',
    url: 'https://www.geckoterminal.com/pulsechain/pools/' + coin.pool
  };
  var extLink = document.getElementById('ext-link');
  extLink.href = ext.url;
  extLink.textContent = 'Open on ' + ext.name + ' ↗';
  extLink.style.display = '';

  loadCoin(coin).then(render).catch(function(err) {
    statusEl.textContent = 'Error: ' + err.message;
  });
}

document.querySelectorAll('.range-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.range-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    setRange(+btn.dataset.bars);
  });
});
</script>
</body>
</html>
